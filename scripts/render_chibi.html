<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cool DJ Human Sprite Generator</title>
</head>
<body>
  <canvas id="cvs" width="320" height="320"></canvas>
  <script src="/js/human_sprites.js"></script>
  <script>
    const canvas = document.getElementById('cvs');
    const ctx = canvas.getContext('2d');

    async function exportAll() {
      console.log('Starting Cool DJ Sprite Export...');
      const totalFrames = 14;

      for (let f = 0; f < totalFrames; f++) {
        HumanSpriteSystem.renderMaleFrame(ctx, f, 'regular', 'style1');
        const dataUrl = canvas.toDataURL('image/png');
        await fetch('/save-frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ character: 'human_male', frame: f + 1, dataUrl })
        });
        console.log(`Exported cool human_male/${f + 1}.png`);
      }

      for (let f = 0; f < totalFrames; f++) {
        HumanSpriteSystem.renderFemaleFrame(ctx, f, 'regular', 'style1');
        const dataUrl = canvas.toDataURL('image/png');
        await fetch('/save-frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ character: 'human_female', frame: f + 1, dataUrl })
        });
        console.log(`Exported cool human_female/${f + 1}.png`);
      }

      console.log('All 28 Cool DJ frames successfully exported!');
      await fetch('/done', { method: 'POST' });
    }

    window.onload = () => {
      exportAll();
    };
  </script>
</body>
</html>
